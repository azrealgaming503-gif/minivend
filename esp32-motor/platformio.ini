; MiniVend motor controller — runs on a generic ESP32 dev board.
; This board is the timing-critical half of the new architecture:
; it owns the stepper drivers and the drop sensors. The Raspberry Pi
; talks to it over USB-serial with the simple line protocol defined
; in src/main.cpp.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=1
