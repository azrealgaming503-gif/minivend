name = "minivend-oauth-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

# REQUIRED: a public URL for the callback HTML page. Deploy
# callback.html to GitHub Pages, Cloudflare Pages, Netlify, etc.,
# then put its absolute URL here. This must also be added as a
# redirect URI in your StreamElements OAuth app.
[vars]
CALLBACK_URL = "https://YOUR-USERNAME.github.io/minivend/callback.html"
SE_SCOPES    = "tips:read activities:read channel:read"

# Set with: wrangler kv:namespace create PAIR_KV
# then paste the id/preview_id Wrangler prints into here.
[[kv_namespaces]]
binding = "PAIR_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets — set these with `wrangler secret put`, not in this file:
#   wrangler secret put SE_CLIENT_ID
#   wrangler secret put SE_CLIENT_SECRET
