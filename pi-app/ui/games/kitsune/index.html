<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Kitsune Farm · Blu</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .f-page { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ---- Header: currency + shop ---- */
    .f-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--stroke); z-index: 5;
      flex-wrap: wrap;
    }
    .f-title { font-size: 18px; font-weight: 700; margin-right: auto; }
    .f-title b { color: var(--accent); }
    .f-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 16px; font-weight: 700; color: var(--text);
      background: var(--surface); border: 1px solid var(--stroke);
      border-radius: 999px; padding: 6px 12px;
    }
    .f-chip svg { width: 18px; height: 18px; }
    .f-chip.coins svg { color: #eab308; }
    .f-chip.love  svg { color: #ff7aa8; }
    .f-header button.shop-btn {
      font-weight: 700; padding: 8px 14px; border-radius: 12px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .f-header button.shop-btn svg { width: 18px; height: 18px; }

    /* ---- Farm field ---- */
    .f-field {
      flex: 1; position: relative; min-height: 0; overflow: hidden;
      /* Tiled pixel-art grass (sprites/grass.png, 32px scaled 2x). A soft
         highlight on top adds depth without hiding the tile. */
      background:
        radial-gradient(circle at 32% 16%, rgba(255,255,255,0.35), transparent 45%),
        url('sprites/grass.png');
      background-size: auto, 64px 64px;
      background-repeat: no-repeat, repeat;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    /* Decorative pond (bathing spot vibe). */
    .f-pond {
      position: absolute; right: 5%; bottom: 6%;
      width: 30%; max-width: 260px; aspect-ratio: 3/2;
      background: radial-gradient(ellipse at 40% 35%, #bfe6ff 0%, #8fd0f0 60%, #5bb6e0 100%);
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.55);
      box-shadow: inset 0 6px 18px rgba(0,80,120,0.18); z-index: 1; overflow: hidden;
    }
    /* Pixel water ripple overlay drifting slowly across the pond. */
    .f-pond::before {
      content: ''; position: absolute; inset: -20%;
      background: url('sprites/pond_ripple.png'); background-size: 96px 96px;
      image-rendering: pixelated; opacity: 0.4;
      animation: pond-drift 9s linear infinite;
    }
    @keyframes pond-drift { from { transform: translate(0,0); } to { transform: translate(-96px,-96px); } }
    .f-pond::after {
      content: ''; position: absolute; left: 22%; top: 28%; width: 26%; height: 16%;
      background: rgba(255,255,255,0.6); border-radius: 50%; filter: blur(1px); z-index: 1;
    }
    /* A fish that occasionally leaps + splashes in the pond. */
    .f-fish {
      position: absolute; transform: translate(-50%, -50%);
      background-image: url('sprites/fish_splash.png'); background-repeat: no-repeat;
      image-rendering: pixelated; image-rendering: crisp-edges;
      pointer-events: none; opacity: 0; z-index: 2;
    }

    /* ---- Decorative terrain (trees, bushes, grass tufts) ---- */
    .f-decor-item {
      position: absolute; transform: translate(-50%, -100%);
      image-rendering: pixelated; image-rendering: crisp-edges;
      pointer-events: none; z-index: 1;
    }
    .f-decor-item img { display: block; width: 100%; height: auto; image-rendering: pixelated; }

    /* ---- Farm structures (barn / troughs) ---- */
    .f-structure {
      position: absolute; z-index: 1; transform: translate(-50%, -100%);
      image-rendering: pixelated; image-rendering: crisp-edges;
      pointer-events: none; filter: drop-shadow(0 6px 5px rgba(60,40,70,0.30));
    }
    .f-structure img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .f-structure.tappable { pointer-events: auto; cursor: pointer; z-index: 2; }
    .f-structure.tappable:active { transform: translate(-50%, -100%) scale(0.94); }
    .f-structure .tag {
      position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%);
      font-size: 11px; font-weight: 700; color: var(--text-2); white-space: nowrap;
      background: rgba(255,255,255,0.82); border-radius: 999px; padding: 1px 8px;
    }
    /* "New critter ready" sign bobbing above the barn. */
    .f-structure.ready { cursor: pointer; }
    .f-structure .barn-badge {
      position: absolute; left: 50%; top: -20px; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap;
      padding: 4px 12px; border-radius: 999px; box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      animation: wild-bounce 0.9s ease-in-out infinite;
    }
    .f-structure .barn-badge::after {
      content: ''; position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%) rotate(45deg);
      width: 9px; height: 9px; background: var(--accent-2);
    }

    /* An animal on the farm. */
    .animal {
      position: absolute; z-index: 2; transform: translate(-50%, -50%);
      cursor: pointer; user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    .animal .body { position: relative; }
    /* Animated spritesheet cell — nearest-neighbor so pixel art stays crisp
       when scaled up. Frame + direction are driven from JS via
       background-image / background-size / background-position. */
    .animal .spr {
      display: block; background-repeat: no-repeat;
      image-rendering: pixelated; image-rendering: crisp-edges;
      pointer-events: none;
    }
    .animal .ph {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      border-radius: 44% 44% 46% 46%;
      font-weight: 800; color: rgba(255,255,255,0.9);
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: inset 0 -6px 10px rgba(0,0,0,0.12);
      filter: drop-shadow(0 4px 3px rgba(60,40,70,0.28));
      pointer-events: none;
    }
    /* soft shadow blob under each animal (art is exported without a shadow).
       Uses a radial-gradient instead of filter:blur so the Pi's GPU doesn't
       have to allocate a blur layer per animal (that caused flickering). */
    .animal .shadow {
      position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
      width: 54%; height: 12%; z-index: -1;
      background: radial-gradient(ellipse at center, rgba(60,40,70,0.34) 0%, rgba(60,40,70,0) 70%);
    }
    /* Static spritesheet frame for the shop / selection avatar. */
    .spr-static { background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; }
    .animal.sel .body { filter: drop-shadow(0 0 0 var(--accent)); }
    .animal.sel::before {
      content: ''; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
      width: 74%; height: 16%; border: 3px solid var(--accent); border-radius: 50%;
      box-shadow: 0 0 14px rgba(184,134,229,0.7); animation: sel-pulse 1.2s ease-in-out infinite;
    }
    @keyframes sel-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    /* Soft colour halo. Built from a radial-gradient (set inline in JS) rather
       than filter:blur to avoid a per-animal GPU blur layer. */
    .animal .glow {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 130%; height: 130%; border-radius: 50%; z-index: -2;
      opacity: 0.5;
    }

    /* Wild critter — pulsing "!" to invite adoption. */
    .animal.wild::after {
      content: '!'; position: absolute; left: 50%; top: -26px; transform: translateX(-50%);
      font-weight: 900; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25); animation: wild-bounce 0.9s ease-in-out infinite;
    }
    @keyframes wild-bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }

    /* Need bubble (hungry/dirty/sad) above an animal. */
    .need-bubble {
      position: absolute; left: 50%; top: -30px; transform: translateX(-50%);
      background: #fff; border: 1px solid var(--stroke); border-radius: 999px;
      padding: 2px; width: 26px; height: 26px; display: none;
      align-items: center; justify-content: center; z-index: 3;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }
    .need-bubble svg { width: 16px; height: 16px; }
    .need-bubble.show { display: flex; animation: nb-bob 1.4s ease-in-out infinite; }
    @keyframes nb-bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-4px); } }

    /* Floating "+" text. */
    .float {
      position: absolute; z-index: 8; pointer-events: none; font-weight: 800;
      font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      animation: floatup 1.1s ease-out forwards;
    }
    @keyframes floatup {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -70px) scale(1.1); }
    }

    /* ---- Bottom sheet: selected animal ---- */
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      background: var(--surface); border-top: 1px solid var(--stroke);
      border-radius: 18px 18px 0 0; box-shadow: 0 -8px 24px rgba(60,40,70,0.18);
      padding: 12px 16px 16px; transform: translateY(110%); transition: transform 0.22s ease;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .sheet-avatar { width: 46px; height: 46px; flex: 0 0 auto; }
    .sheet-avatar img, .sheet-avatar .ph { width: 100%; height: 100%; border-radius: 12px; object-fit: contain; }
    .sheet-avatar .ph { display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; }
    .name-input {
      font-size: 20px; font-weight: 700; color: var(--text);
      background: var(--bg-2); border: 1px dashed var(--stroke); border-radius: 10px;
      padding: 6px 10px; width: 100%; max-width: 260px;
    }
    .name-hint { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .sheet-close {
      margin-left: auto; width: 40px; height: 40px; border-radius: 50%;
      font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .sheet-species { font-size: 13px; color: var(--text-2); }
    .f-bars { display: grid; gap: 6px; margin: 8px 0 12px; }
    .f-bar-row { display: flex; align-items: center; gap: 8px; }
    .f-bar-row .lbl { display: inline-flex; align-items: center; gap: 6px; width: 96px; font-size: 14px; color: var(--text-2); }
    .f-bar-row .lbl svg { width: 15px; height: 15px; }
    .f-bar { flex: 1; height: 12px; border-radius: 999px; background: #ece1f4; overflow: hidden; }
    .f-bar > i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 0.3s ease, background 0.3s ease; }
    .care-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .care-actions button {
      font-size: 15px; font-weight: 700; padding: 10px 4px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .care-actions button .ic svg { width: 24px; height: 24px; }
    .care-actions button .cost { font-size: 11px; color: var(--text-2); font-weight: 600; }
    .care-actions button.release { grid-column: span 4; background: transparent; color: var(--danger); border: 1px dashed var(--danger); }

    /* ---- Shop modal ---- */
    .modal-back {
      position: absolute; inset: 0; z-index: 30; background: rgba(40,20,50,0.35);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-back.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--stroke); border-radius: 18px;
      width: 100%; max-width: 440px; max-height: 84vh; overflow: auto; padding: 16px;
      box-shadow: 0 12px 40px rgba(40,20,50,0.4);
    }
    .modal h2 { margin: 0 0 4px; }
    .modal .sub { color: var(--text-2); font-size: 13px; margin: 0 0 12px; }
    .shop-section-title { font-weight: 800; font-size: 15px; margin: 16px 0 8px; color: var(--text); }
    .shop-section-title:first-of-type { margin-top: 4px; }
    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .shop-item {
      border: 1px solid var(--stroke); border-radius: 14px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
      background: var(--bg-2);
    }
    .shop-item .pic { width: 64px; height: 64px; }
    .shop-item .pic img, .shop-item .pic .ph { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
    .shop-item .pic .ph { display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; }
    .shop-item .nm { font-weight: 700; }
    .shop-item .rt { font-size: 12px; color: var(--text-2); }
    .shop-item button { width: 100%; font-weight: 700; padding: 8px; border-radius: 10px; }
    .shop-item button:disabled { opacity: 0.5; }
    .modal-close { margin-top: 14px; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; }

    /* Sakura backdrop */
    .f-sakura { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .f-petal {
      position: absolute; top: 0; width: 12px; height: 12px;
      background: radial-gradient(circle at 30% 30%, #ffe1ec 0%, #ffb3cd 55%, #ff8fb6 100%);
      border-radius: 100% 0 100% 0; opacity: 0;
      animation-name: boot-splash-sakura-fall; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
    }
    .f-hint {
      position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 4;
      background: rgba(255,255,255,0.85); border: 1px solid var(--stroke); border-radius: 999px;
      padding: 6px 14px; font-size: 13px; color: var(--text-2); pointer-events: none;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body class="theme-pastel">
  <div class="f-page">
    <header class="f-header">
      <a href="/games"><button class="ghost">← Back</button></a>
      <div class="f-title">Blu's <b>Kitsune Farm</b></div>
      <div class="f-chip coins" id="coins-chip"></div>
      <div class="f-chip love"  id="love-chip"></div>
      <button class="shop-btn primary" id="shop-open"></button>
    </header>

    <main class="f-field" id="field">
      <div class="f-sakura" id="sakura"></div>
      <div class="f-pond"></div>
      <div class="f-fish" id="fish"></div>
      <div id="decor"></div>
      <div id="structures"></div>
      <div class="f-hint" id="hint">Tap an animal to care for it · build a barn in the shop to attract new critters</div>

      <!-- Selected-animal bottom sheet -->
      <div class="sheet" id="sheet">
        <div class="sheet-top">
          <div class="sheet-avatar" id="sheet-avatar"></div>
          <div style="min-width:0;">
            <input class="name-input" id="name-input" type="text" maxlength="16"
                   data-keyboard-title="Name your animal" placeholder="Name" />
            <div class="sheet-species" id="sheet-species"></div>
          </div>
          <button class="ghost sheet-close" id="sheet-close">×</button>
        </div>
        <div class="f-bars" id="sheet-bars"></div>
        <div class="care-actions" id="care-actions"></div>
      </div>
    </main>
  </div>

  <!-- Shop modal -->
  <div class="modal-back" id="shop-back">
    <div class="modal">
      <h2>Farm Shop</h2>
      <p class="sub">Buy new friends and farm gear. Animals earn coins while you keep them fed, watered, clean and happy.</p>
      <div class="shop-section-title">Critters</div>
      <div class="shop-grid" id="shop-grid"></div>
      <div class="shop-section-title">Farm gear</div>
      <div class="shop-grid" id="shop-struct-grid"></div>
      <button class="ghost modal-close" id="shop-close">Close</button>
    </div>
  </div>

  <script type="module">
    import '/js/alerts.js';
    import { attachKeyboard } from '/js/keyboard.js';
    attachKeyboard();

    // ---------- SVG icons (kiosk has no color emoji) ----------
    const S = (inner, fill) =>
      `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="${fill ? 'none' : 'currentColor'}"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    const ICONS = {
      coin:  S('<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2 0 0 1 5 0c0 2.5-5 1.5-5 4a2.5 2 0 0 0 5 0"/>'),
      love:  S('<path d="M12 20s-6.5-4.2-9-8.3A4.6 4.6 0 0 1 12 6.5 4.6 4.6 0 0 1 21 11.7C18.5 15.8 12 20 12 20z"/>', true),
      shop:  S('<path d="M3 9l1.5-5h15L21 9M4 9h16v11H4zM9 13h6"/>'),
      feed:  S('<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M12 11V6"/><path d="M9.5 6.5a2.5 2.5 0 0 1 5 0"/>'),
      water: S('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>', true),
      bath:  S('<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M7 12V6a2 2 0 0 1 4 0"/><path d="M6 21l-1 1M18 21l1 1"/>'),
      play:  S('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16M4 12a8 8 0 0 0 16 0"/>'),
      full:  S('<path d="M3 11h18a9 9 0 0 1-18 0z"/>'),
      happy: S('<path d="M12 20s-6.5-4.2-9-8.3A4.6 4.6 0 0 1 12 6.5 4.6 4.6 0 0 1 21 11.7C18.5 15.8 12 20 12 20z"/>', true),
      clean: S('<path d="M12 2l1.7 4.6L18 8l-4.3 1.4L12 14l-1.7-4.6L6 8l4.3-1.4z"/>', true),
    };

    // ---------- Manifest (animal species) ----------
    // Sprites are 32px pixel-art sheets: 4 rows = directions (down/up/left/
    // right), columns = animation frames. Each species ships a _walk and an
    // _idle sheet. See sprites/manifest.json + README.
    const ROW_COUNT = 4;
    const DEFAULT_ROWS = { down: 0, up: 1, left: 2, right: 3 };
    const WALK_FPS = 10, IDLE_FPS = 4;
    const DEFAULT_MANIFEST = {
      frame: 32,
      rows: DEFAULT_ROWS,
      animals: [
        { id:'fox',     name:'Fox',          price:0,   rarity:'common',   coinsPerMin:2, color:'#c0563a', walkCols:6, idleCols:4 },
        { id:'chicken', name:'Chicken',      price:40,  rarity:'common',   coinsPerMin:2, color:'#e6d3ac', walkCols:6, idleCols:6 },
        { id:'hare',    name:'Hare',         price:60,  rarity:'common',   coinsPerMin:2, color:'#a9855f', walkCols:5, idleCols:4 },
        { id:'grouse',  name:'Black grouse', price:90,  rarity:'common',   coinsPerMin:2, color:'#4a4550', walkCols:6, idleCols:4 },
        { id:'pig',     name:'Pig',          price:140, rarity:'common',   coinsPerMin:3, color:'#d98c99', walkCols:6, idleCols:4 },
        { id:'deer',    name:'Deer',         price:220, rarity:'uncommon', coinsPerMin:4, color:'#6f4a34', walkCols:6, idleCols:4 },
        { id:'boar',    name:'Boar',         price:260, rarity:'uncommon', coinsPerMin:4, color:'#5a4636', walkCols:6, idleCols:4 },
        { id:'cow',     name:'Cow',          price:360, rarity:'uncommon', coinsPerMin:5, color:'#c3cad2', walkCols:6, idleCols:4 },
      ],
    };
    let SPECIES = [];               // loaded species list
    let ROWS = DEFAULT_ROWS;        // direction -> row index
    const speciesById = new Map();
    const spriteOK = new Map();     // id -> boolean (walk sheet loaded)

    async function loadSpecies() {
      let data = DEFAULT_MANIFEST;
      try {
        const r = await fetch('sprites/manifest.json', { cache: 'no-cache' });
        if (r.ok) {
          const j = await r.json();
          if (j && Array.isArray(j.animals) && j.animals.length) data = j;
        }
      } catch (_) { /* use default */ }
      ROWS = Object.assign({}, DEFAULT_ROWS, data.rows || {});
      SPECIES = data.animals.map((a) => {
        const id = String(a.id);
        return {
          id,
          name: a.name || id,
          price: Math.max(0, +a.price || 0),
          rarity: a.rarity === 'uncommon' ? 'uncommon' : 'common',
          coinsPerMin: Math.max(0, +a.coinsPerMin || 1),
          color: a.color || '#b886e5',
          walkCols: Math.max(1, +a.walkCols || 4),
          idleCols: Math.max(1, +a.idleCols || 4),
          walkUrl: `sprites/${encodeURIComponent(id)}_walk.png`,
          idleUrl: `sprites/${encodeURIComponent(id)}_idle.png`,
        };
      });
      speciesById.clear();
      SPECIES.forEach((sp) => speciesById.set(sp.id, sp));
      await Promise.all(SPECIES.map(probeSprite));
    }

    function probeSprite(sp) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { spriteOK.set(sp.id, true); resolve(); };
        img.onerror = () => { spriteOK.set(sp.id, false); resolve(); };
        img.src = sp.walkUrl;
      });
    }

    // Static frame (idle sheet, facing down, frame 0) for shop tiles and the
    // selection avatar. Falls back to a colored placeholder if art is missing.
    function staticVisual(id, sizePx) {
      const sp = speciesById.get(id);
      const color = sp ? sp.color : '#b886e5';
      if (sp && spriteOK.get(id)) {
        const bgW = sp.idleCols * sizePx, bgH = ROW_COUNT * sizePx;
        const posY = -(ROWS.down * sizePx);
        return `<div class="spr-static" style="width:${sizePx}px;height:${sizePx}px;` +
               `background-image:url('${sp.idleUrl}');background-size:${bgW}px ${bgH}px;` +
               `background-position:0px ${posY}px;"></div>`;
      }
      const letter = (sp ? sp.name : id).charAt(0).toUpperCase();
      return `<div class="ph" style="width:${sizePx}px;height:${sizePx}px;background:${color};font-size:${Math.round(sizePx*0.42)}px;">${letter}</div>`;
    }

    // ---------- Purchasable farm structures ----------
    const BASE_MAX_ANIMALS = 12;
    const BARN_BONUS = 8;                 // extra animal space the barn unlocks
    const STRUCTURES = [
      { id:'feed',  name:'Feed trough',  price:150, img:'sprites/feed_trough.png',  desc:'Tap it to feed every animal' },
      { id:'water', name:'Water trough', price:150, img:'sprites/water_trough.png', desc:'Tap it to water every animal' },
      { id:'barn',  name:'Barn',         price:600, img:'sprites/barn.png',         desc:`+${BARN_BONUS} space · attracts new critters` },
    ];
    const structById = new Map(STRUCTURES.map((s) => [s.id, s]));

    // ---------- Persistent state ----------
    const KEY = 'minivend.kitsunefarm.v1';
    const HR = 3600000;
    const OFFLINE_CAP_HR = 8;         // cap idle earnings when away
    const SPAWN_INTERVAL_MS = 6 * HR; // active stream time between spawn rolls
    const SPAWN_CHANCE = 0.5;         // 50% chance a wild appears each interval
    const ACTIVE_STEP_CAP_MS = 15000; // gaps bigger than this = offline, don't count
    const clamp = (v) => Math.max(0, Math.min(100, v));
    const NEED_DECAY = { fullness: -6, water: -7, happy: -5, clean: -4 }; // per hour

    let st = loadState();
    let uidSeq = st.animals.reduce((m, a) => Math.max(m, a.uid), 0) + 1;

    function maxAnimals() { return BASE_MAX_ANIMALS + (st.structures.barn ? BARN_BONUS : 0); }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY));
        if (raw && typeof raw === 'object') return normalizeState(raw);
      } catch (_) {}
      // First run: 50 coins and one starter fox.
      return {
        version: 1, coins: 50, love: 0, lastTs: Date.now(), spawnAccumMs: 0, pendingTypes: [],
        structures: { feed: false, water: false, barn: false },
        animals: [{ uid: 1, type: 'fox', name: 'Kit', fullness: 85, water: 85, happy: 85, clean: 85, bornTs: Date.now() }],
      };
    }
    function normalizeState(r) {
      const animals = Array.isArray(r.animals) ? r.animals.map((a, i) => ({
        uid: +a.uid || (i + 1),
        type: String(a.type || 'fox'),
        name: typeof a.name === 'string' ? a.name.slice(0, 16) : 'Friend',
        fullness: clamp(+a.fullness ?? 80), water: clamp(+a.water ?? 80),
        happy: clamp(+a.happy ?? 80), clean: clamp(+a.clean ?? 80),
        bornTs: +a.bornTs || Date.now(),
      })) : [];
      const s = r.structures || {};
      return {
        version: 1,
        coins: Math.max(0, Math.round(+r.coins || 0)),
        love: Math.max(0, Math.round(+r.love || 0)),
        lastTs: +r.lastTs || Date.now(),
        spawnAccumMs: Math.max(0, +r.spawnAccumMs || 0),
        pendingTypes: Array.isArray(r.pendingTypes)
          ? r.pendingTypes.filter((t) => typeof t === 'string').slice(0, 24)
          : [],
        structures: { feed: !!s.feed, water: !!s.water, barn: !!s.barn },
        animals,
      };
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} }

    const careFactor = (a) => (a.fullness + a.water + a.happy + a.clean) / 400; // 0..1

    // Apply need decay + coin earnings for an elapsed span (hours).
    function advance(dtHr) {
      if (dtHr <= 0) return 0;
      let earned = 0;
      for (const a of st.animals) {
        // Earnings depend on how well cared-for the animal is (avg needs).
        const sp = speciesById.get(a.type);
        const rate = sp ? sp.coinsPerMin : 1;
        earned += rate * 60 * dtHr * careFactor(a);
        a.fullness = clamp(a.fullness + NEED_DECAY.fullness * dtHr);
        a.water    = clamp(a.water    + NEED_DECAY.water    * dtHr);
        a.happy    = clamp(a.happy    + NEED_DECAY.happy    * dtHr);
        a.clean    = clamp(a.clean    + NEED_DECAY.clean    * dtHr);
      }
      earned = Math.floor(earned);
      if (earned > 0) { st.coins += earned; }
      return earned;
    }

    // ---------- DOM refs ----------
    const field = document.getElementById('field');
    const coinsChip = document.getElementById('coins-chip');
    const loveChip = document.getElementById('love-chip');
    const hintEl = document.getElementById('hint');

    // ---------- Runtime animal actors (movement) ----------
    // uid -> { el, needBubble, x, y, tx, ty, speed, dir, pauseUntil, wild, wildLeaveAt, type }
    const actors = new Map();
    const FIELD_MARGIN = 7;         // percent inset for wandering bounds
    const Y_MIN = 24, Y_MAX = 92;   // keep animals in the grassy area

    function rand(a, b) { return a + Math.random() * (b - a); }
    function pickTarget(act) {
      act.tx = rand(FIELD_MARGIN, 100 - FIELD_MARGIN);
      act.ty = rand(Y_MIN, Y_MAX);
      act.speed = rand(2.2, 4.5);   // percent per second
    }

    function animalSizePx() {
      // scale with the smaller viewport dimension; keep sane bounds
      const base = Math.min(field.clientWidth, field.clientHeight);
      return Math.round(Math.max(56, Math.min(104, base * 0.16)));
    }

    function makeActor(a, wild) {
      const size = animalSizePx();
      const el = document.createElement('div');
      el.className = 'animal' + (wild ? ' wild' : '');
      el.dataset.uid = a.uid;
      const sp = speciesById.get(a.type);
      const glowColor = sp ? sp.color : '#b886e5';
      const hasSprite = !!(sp && spriteOK.get(a.type));
      const inner = hasSprite
        ? `<div class="spr" style="width:${size}px;height:${size}px;"></div>`
        : staticVisual(a.type, size);
      el.innerHTML = `
        <div class="glow" style="background:radial-gradient(circle, ${glowColor} 0%, ${glowColor}00 68%)"></div>
        <div class="need-bubble"></div>
        <div class="body">${inner}<div class="shadow"></div></div>`;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      field.appendChild(el);
      const act = {
        el, needBubble: el.querySelector('.need-bubble'),
        body: el.querySelector('.body'), spr: el.querySelector('.spr'),
        sp, hasSprite, box: size,
        anim: 'idle', frame: 0, frameT: 0, dirRow: ROWS.down, curSheet: '',
        x: rand(FIELD_MARGIN, 100 - FIELD_MARGIN), y: rand(Y_MIN, Y_MAX),
        tx: 0, ty: 0, speed: 3, pauseUntil: 0,
        wild: !!wild, wildLeaveAt: wild ? Date.now() + rand(300000, 600000) : 0,
        type: a.type,
      };
      pickTarget(act);
      actors.set(a.uid, act);
      el.addEventListener('click', () => onAnimalTap(a.uid));
      positionActor(act);
      applySprite(act);
      return act;
    }

    // Point an actor's sprite cell at the current anim/frame/direction.
    function applySprite(act) {
      if (!act.hasSprite || !act.spr) return;
      const sp = act.sp, box = act.box;
      const walk = act.anim === 'walk';
      const url = walk ? sp.walkUrl : sp.idleUrl;
      const cols = walk ? sp.walkCols : sp.idleCols;
      if (act.curSheet !== act.anim) {
        act.spr.style.backgroundImage = `url('${url}')`;
        act.spr.style.backgroundSize = `${cols * box}px ${ROW_COUNT * box}px`;
        act.curSheet = act.anim;
      }
      const fx = -(act.frame % cols) * box;
      const fy = -(act.dirRow) * box;
      act.spr.style.backgroundPosition = `${fx}px ${fy}px`;
    }

    function positionActor(act) {
      act.el.style.left = act.x + '%';
      act.el.style.top = act.y + '%';
      // Depth: lower on screen = a touch bigger + drawn on top. Facing is
      // handled by the spritesheet direction rows, so no horizontal flip here.
      const depth = 0.82 + (act.y / 100) * 0.34;
      act.body.style.transform = `scale(${depth})`;
      act.el.style.zIndex = 2 + Math.round(act.y);
    }

    // ---------- Barn: attract new critters ----------
    // Random spawns only run once a barn is built. A spawn parks a critter
    // "at the barn"; a sign appears above the barn and the player taps it to
    // name the animal and add it to the herd.
    function triggerBarnSpawn() {
      if (!st.structures.barn) return;
      if (countOwned() + st.pendingTypes.length >= maxAnimals()) return; // no room yet
      // Weighted pick: commons appear ~3x as often as uncommons.
      const pool = [];
      for (const sp of SPECIES) { const w = sp.rarity === 'uncommon' ? 1 : 3; for (let i = 0; i < w; i++) pool.push(sp.id); }
      if (!pool.length) return;
      st.pendingTypes.push(pool[Math.floor(Math.random() * pool.length)]);
      save(); renderStructures();
      flashHint('A new critter is waiting at the barn! Tap the barn to welcome it.');
    }
    // Welcome the next critter waiting at the barn.
    function adoptFromBarn() {
      if (!st.pendingTypes.length) return;
      if (countOwned() >= maxAnimals()) { flashHint('Your farm is full! Release one first.'); return; }
      const type = st.pendingTypes.shift();
      const a = { uid: uidSeq++, type, name: defaultName(type),
                  fullness: 75, water: 80, happy: 80, clean: 75, bornTs: Date.now() };
      st.animals.push(a);
      const na = makeActor(a, false);
      na.x = rand(44, 56); na.y = 42; positionActor(na); applySprite(na);
      save(); renderStructures(); render();
      floatText(na.x, na.y, '+ new friend!', '#ff7aa8');
      selectAnimal(a.uid, true);
    }
    function countOwned() { return st.animals.length; }

    function removeActor(uid) {
      const act = actors.get(uid);
      if (act) { act.el.remove(); actors.delete(uid); }
    }

    // ---------- Interaction ----------
    let selectedUid = null;
    function onAnimalTap(uid) {
      const act = actors.get(uid);
      if (!act) return;
      if (act.wild) { adoptWild(uid); return; }
      selectAnimal(uid);
    }

    function adoptWild(wildUid) {
      const act = actors.get(wildUid);
      if (!act) return;
      if (countOwned() >= maxAnimals()) { flashHint('Your farm is full! Buy a barn or release one first.'); return; }
      const sp = speciesById.get(act.wildType);
      const a = {
        uid: uidSeq++, type: act.wildType,
        name: defaultName(act.wildType),
        fullness: 75, water: 80, happy: 80, clean: 75, bornTs: Date.now(),
      };
      st.animals.push(a);
      // Convert the wild actor into an owned one at the same spot/facing.
      const x = act.x, y = act.y, dirRow = act.dirRow;
      removeActor(wildUid);
      const na = makeActor(a, false);
      na.x = x; na.y = y; na.dirRow = dirRow; positionActor(na); applySprite(na);
      save();
      floatText(x, y, '+ new friend!', '#ff7aa8');
      selectAnimal(a.uid, true);
    }

    function defaultName(type) {
      const sp = speciesById.get(type);
      const base = sp ? sp.name : 'Friend';
      const n = st.animals.filter((a) => a.type === type).length;
      return n > 1 ? `${base} ${n}` : base;
    }

    // ---------- Bottom sheet ----------
    const sheet = document.getElementById('sheet');
    const nameInput = document.getElementById('name-input');
    const sheetAvatar = document.getElementById('sheet-avatar');
    const sheetSpecies = document.getElementById('sheet-species');
    const sheetBars = document.getElementById('sheet-bars');
    const careActionsEl = document.getElementById('care-actions');

    const BAR_DEFS = [
      { k: 'fullness', label: 'Fullness', icon: ICONS.full },
      { k: 'water',    label: 'Water',    icon: ICONS.water },
      { k: 'happy',    label: 'Happy',    icon: ICONS.happy },
      { k: 'clean',    label: 'Clean',    icon: ICONS.clean },
    ];
    sheetBars.innerHTML = BAR_DEFS.map((d) =>
      `<div class="f-bar-row"><span class="lbl">${d.icon}${d.label}</span>
        <div class="f-bar"><i id="sbar-${d.k}"></i></div></div>`).join('');

    const FEED_COST = 8;
    const CARE = [
      { id: 'feed', label: 'Feed', icon: ICONS.feed, cost: FEED_COST, run(a, act) {
          if (st.coins < FEED_COST) return flashHint('Not enough coins — let them earn a bit!');
          if (a.fullness > 96) return flashHint(`${a.name} is full!`);
          st.coins -= FEED_COST; a.fullness = clamp(a.fullness + 30); addLove(2, act);
          floatText(act.x, act.y, `-${FEED_COST}`, '#eab308'); commit();
      } },
      { id: 'water', label: 'Water', icon: ICONS.water, run(a, act) {
          if (a.water > 96) return flashHint(`${a.name} isn't thirsty right now.`);
          a.water = clamp(a.water + 45); addLove(1, act);
          floatText(act.x, act.y, '+water', '#5bb6e0'); commit();
      } },
      { id: 'bath', label: 'Bathe', icon: ICONS.bath, run(a, act) {
          if (a.clean > 96) return flashHint(`${a.name} is squeaky clean!`);
          a.clean = clamp(a.clean + 40); a.happy = clamp(a.happy + 4); addLove(2, act); commit();
      } },
      { id: 'play', label: 'Play', icon: ICONS.play, run(a, act) {
          a.happy = clamp(a.happy + 26); a.fullness = clamp(a.fullness - 5); addLove(3, act); commit();
      } },
      { id: 'release', label: 'Release', icon: '', run(a) {
          if (!confirm(`Release ${a.name} back to the wild? This can't be undone.`)) return;
          st.animals = st.animals.filter((x) => x.uid !== a.uid);
          removeActor(a.uid); closeSheet(); save(); render();
      } },
    ];
    careActionsEl.innerHTML = CARE.map((c) => {
      if (c.id === 'release') return `<button class="release" data-care="release">Release to the wild</button>`;
      const cost = c.cost ? `<span class="cost">${c.cost} coins</span>` : `<span class="cost">free</span>`;
      return `<button data-care="${c.id}"><span class="ic">${c.icon}</span>${c.label}${cost}</button>`;
    }).join('');
    careActionsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-care]'); if (!btn) return;
      const a = st.animals.find((x) => x.uid === selectedUid); if (!a) return;
      const act = actors.get(selectedUid);
      const care = CARE.find((c) => c.id === btn.dataset.care); if (care) care.run(a, act);
    });

    function addLove(n, act) {
      st.love += n;
      if (act) floatText(act.x, act.y, `+${n} ♥`, '#ff7aa8');
    }
    // Persist + refresh chips/bars after a care action.
    function commit() {
      save(); render();
      const a = st.animals.find((x) => x.uid === selectedUid);
      if (a) updateSheetBars(a);
    }

    function selectAnimal(uid, focusName) {
      selectedUid = uid;
      for (const [id, act] of actors) act.el.classList.toggle('sel', id === uid);
      const a = st.animals.find((x) => x.uid === uid); if (!a) return;
      const sp = speciesById.get(a.type);
      sheetAvatar.innerHTML = staticVisual(a.type, 46);
      sheetSpecies.textContent = sp ? sp.name : a.type;
      nameInput.value = a.name;
      updateSheetBars(a);
      sheet.classList.add('open');
      if (focusName) setTimeout(() => nameInput.click(), 250); // opens on-screen keyboard
    }
    function updateSheetBars(a) {
      for (const d of BAR_DEFS) {
        const el = document.getElementById('sbar-' + d.k); if (!el) continue;
        el.style.width = a[d.k] + '%';
        el.style.background = a[d.k] < 25 ? '#ef6a8f' : a[d.k] < 55 ? '#ffb84d' : 'linear-gradient(90deg,#b886e5,#ffa3d1)';
      }
    }
    function closeSheet() {
      sheet.classList.remove('open'); selectedUid = null;
      for (const act of actors.values()) act.el.classList.remove('sel');
    }
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    nameInput.addEventListener('change', () => {
      const a = st.animals.find((x) => x.uid === selectedUid); if (!a) return;
      a.name = (nameInput.value || '').trim().slice(0, 16) || defaultName(a.type);
      nameInput.value = a.name; save();
    });

    // ---------- Floating text + hint ----------
    function floatText(xPct, yPct, text, color) {
      const el = document.createElement('div');
      el.className = 'float'; el.textContent = text; el.style.color = color || 'var(--accent)';
      el.style.left = xPct + '%'; el.style.top = yPct + '%';
      field.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }
    let hintTimer = null;
    function flashHint(msg) {
      hintEl.textContent = msg; hintEl.style.opacity = '1';
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { hintEl.style.opacity = '0.0'; }, 3200);
    }

    // ---------- Render (chips + bars + need bubbles) ----------
    function render() {
      coinsChip.innerHTML = `${ICONS.coin}${st.coins.toLocaleString()}`;
      loveChip.innerHTML = `${ICONS.love}${st.love.toLocaleString()}`;
      // Sync actors with owned animals (add missing).
      for (const a of st.animals) if (!actors.has(a.uid)) makeActor(a, false);
      // Need bubbles + selected bars.
      for (const a of st.animals) {
        const act = actors.get(a.uid); if (!act) continue;
        const stats = [
          { v: a.fullness, icon: ICONS.feed },
          { v: a.water,    icon: ICONS.water },
          { v: a.clean,    icon: ICONS.bath },
          { v: a.happy,    icon: ICONS.play },
        ];
        let lowest = stats[0];
        for (const s of stats) if (s.v < lowest.v) lowest = s;
        if (lowest.v < 30) {
          act.needBubble.innerHTML = lowest.icon; act.needBubble.classList.add('show');
        } else act.needBubble.classList.remove('show');
      }
      if (selectedUid != null) {
        const a = st.animals.find((x) => x.uid === selectedUid);
        if (a) updateSheetBars(a); else closeSheet();
      }
    }

    // ---------- Shop ----------
    const shopBack = document.getElementById('shop-back');
    const shopGrid = document.getElementById('shop-grid');
    const shopStructGrid = document.getElementById('shop-struct-grid');
    document.getElementById('shop-open').innerHTML = `${ICONS.shop}Shop`;
    document.getElementById('shop-open').addEventListener('click', openShop);
    document.getElementById('shop-close').addEventListener('click', () => shopBack.classList.remove('open'));
    shopBack.addEventListener('click', (e) => { if (e.target === shopBack) shopBack.classList.remove('open'); });

    function openShop() {
      shopGrid.innerHTML = SPECIES.map((sp) => {
        const canAfford = st.coins >= sp.price;
        const full = countOwned() >= maxAnimals();
        const label = full ? 'Farm full' : (sp.price === 0 ? 'Adopt free' : `${sp.price} coins`);
        return `<div class="shop-item">
          <div class="pic">${staticVisual(sp.id, 64)}</div>
          <div class="nm">${sp.name}</div>
          <div class="rt">${sp.coinsPerMin} coins/min · ${sp.rarity}</div>
          <button class="primary" data-buy="${sp.id}" ${(!canAfford || full) ? 'disabled' : ''}>${label}</button>
        </div>`;
      }).join('');
      shopStructGrid.innerHTML = STRUCTURES.map((it) => {
        const owned = !!st.structures[it.id];
        const canAfford = st.coins >= it.price;
        const label = owned ? 'Owned' : `${it.price} coins`;
        return `<div class="shop-item">
          <div class="pic"><img src="${it.img}" alt="${it.name}" style="image-rendering:pixelated"></div>
          <div class="nm">${it.name}</div>
          <div class="rt">${it.desc}</div>
          <button class="primary" data-struct="${it.id}" ${(owned || !canAfford) ? 'disabled' : ''}>${label}</button>
        </div>`;
      }).join('');
      shopBack.classList.add('open');
    }
    shopStructGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-struct]'); if (!btn) return;
      const it = structById.get(btn.dataset.struct); if (!it) return;
      if (st.structures[it.id]) return;
      if (st.coins < it.price) return flashHint('Not enough coins yet.');
      st.coins -= it.price;
      st.structures[it.id] = true;
      if (it.id === 'barn') st.spawnAccumMs = 0;   // start the spawn timer fresh
      save(); renderStructures(); render(); openShop();
      flashHint(it.id === 'barn'
        ? 'Barn built! New critters will start arriving over time — watch for the sign above it.'
        : `${it.name} added to your farm!`);
    });

    // ---------- Placed structures (barn + troughs) ----------
    const structuresLayer = document.getElementById('structures');
    // left/top are % of the field (anchor = bottom-centre of the art);
    // wf = width as a fraction of field width, clamped to [min,max] px.
    const STRUCT_LAYOUT = {
      barn:  { left: 50, top: 32, wf: 0.24, min: 118, max: 210 },
      feed:  { left: 30, top: 66, wf: 0.10, min: 54,  max: 96 },
      water: { left: 68, top: 64, wf: 0.10, min: 54,  max: 96 },
    };
    function renderStructures() {
      structuresLayer.innerHTML = '';
      const fw = field.clientWidth;
      for (const it of STRUCTURES) {
        if (!st.structures[it.id]) continue;
        const lay = STRUCT_LAYOUT[it.id];
        const w = Math.round(Math.max(lay.min, Math.min(lay.max, fw * lay.wf)));
        const pending = st.pendingTypes.length;
        const barnReady = it.id === 'barn' && pending > 0;
        const tappable = it.id === 'feed' || it.id === 'water' || barnReady;
        const el = document.createElement('div');
        el.className = 'f-structure' + (tappable ? ' tappable' : '') + (barnReady ? ' ready' : '');
        el.style.left = lay.left + '%';
        el.style.top = lay.top + '%';
        el.style.width = w + 'px';
        el.style.zIndex = tappable ? (2 + Math.round(lay.top)) : 1;
        let overlay = '';
        if (it.id === 'feed') overlay = `<span class="tag">Tap to feed all</span>`;
        else if (it.id === 'water') overlay = `<span class="tag">Tap to water all</span>`;
        else if (barnReady) overlay = `<span class="barn-badge">${pending > 1 ? pending + ' ready!' : 'New critter!'}</span>`;
        el.innerHTML = `<img src="${it.img}" alt="${it.name}">` + overlay;
        if (it.id === 'feed') el.addEventListener('click', () => feedAll(el));
        else if (it.id === 'water') el.addEventListener('click', () => waterAll(el));
        else if (barnReady) el.addEventListener('click', adoptFromBarn);
        structuresLayer.appendChild(el);
      }
    }
    function structFloat(el, text, color) {
      floatText(parseFloat(el.style.left), parseFloat(el.style.top) - 6, text, color);
    }
    function feedAll(originEl) {
      const need = st.animals.filter((a) => a.fullness <= 96).sort((x, y) => x.fullness - y.fullness);
      if (!need.length) return flashHint('Everyone is full!');
      let fed = 0;
      for (const a of need) {
        if (st.coins < FEED_COST) break;
        st.coins -= FEED_COST; a.fullness = clamp(a.fullness + 30); fed++;
      }
      if (!fed) return flashHint('Not enough coins to feed anyone.');
      addLove(fed, null);
      structFloat(originEl, `-${fed * FEED_COST}`, '#eab308');
      flashHint(fed < need.length ? `Fed ${fed} of ${need.length} — ran low on coins.` : `Fed all ${fed} animals!`);
      save(); render();
    }
    function waterAll(originEl) {
      const need = st.animals.filter((a) => a.water <= 96);
      if (!need.length) return flashHint('No one is thirsty!');
      for (const a of need) a.water = clamp(a.water + 45);
      addLove(need.length, null);
      structFloat(originEl, '+water', '#5bb6e0');
      flashHint(`Watered all ${need.length} animals!`);
      save(); render();
    }

    // ---------- Decorative terrain (trees / bushes / grass tufts) ----------
    // Fixed, curated placements (% of field, anchor = bottom-centre) so the
    // scenery frames the play area without covering the troughs, barn or pond.
    const decorLayer = document.getElementById('decor');
    const DECOR = [
      { img: 'tree1.png', left: 7,  top: 45, size: 'tree' },
      { img: 'tree2.png', left: 93, top: 42, size: 'tree' },
      { img: 'bush.png',  left: 15, top: 60, size: 'bush' },
      { img: 'bush.png',  left: 90, top: 58, size: 'bush' },
      { img: 'bush.png',  left: 5,  top: 78, size: 'bush' },
      { img: 'tuft.png',  left: 26, top: 58, size: 'tuft' },
      { img: 'tuft.png',  left: 45, top: 42, size: 'tuft' },
      { img: 'tuft.png',  left: 60, top: 52, size: 'tuft' },
      { img: 'tuft.png',  left: 80, top: 42, size: 'tuft' },
      { img: 'tuft.png',  left: 16, top: 86, size: 'tuft' },
      { img: 'tuft.png',  left: 40, top: 90, size: 'tuft' },
      { img: 'tuft.png',  left: 62, top: 92, size: 'tuft' },
      { img: 'tuft.png',  left: 52, top: 72, size: 'tuft' },
    ];
    const DECOR_SIZE = {
      tree: { wf: 0.15, min: 90, max: 150 },
      bush: { wf: 0.06, min: 42, max: 72 },
      tuft: { wf: 0.035, min: 22, max: 38 },
    };
    function renderDecor() {
      decorLayer.innerHTML = '';
      const fw = field.clientWidth;
      for (const d of DECOR) {
        const s = DECOR_SIZE[d.size];
        const w = Math.round(Math.max(s.min, Math.min(s.max, fw * s.wf)));
        const el = document.createElement('div');
        el.className = 'f-decor-item';
        el.style.left = d.left + '%'; el.style.top = d.top + '%'; el.style.width = w + 'px';
        el.innerHTML = `<img src="sprites/${d.img}" alt="">`;
        decorLayer.appendChild(el);
      }
    }

    // ---------- Pond fish (occasional leap + splash) ----------
    const fishEl = document.getElementById('fish');
    const FISH_FRAMES = 9, FISH_FPS = 11;
    let fishAnim = null, fishTimer = null;
    function playFish() {
      const size = Math.round(Math.max(34, Math.min(58, field.clientWidth * 0.05)));
      fishEl.style.width = size + 'px'; fishEl.style.height = size + 'px';
      fishEl.style.backgroundSize = `${FISH_FRAMES * size}px ${size}px`;
      fishEl.style.left = rand(72, 88) + '%';    // stay within the pond
      fishEl.style.top = rand(82, 91) + '%';
      fishEl.style.backgroundPosition = '0px 0px';
      fishEl.style.opacity = '1';
      let f = 0;
      clearInterval(fishAnim);
      fishAnim = setInterval(() => {
        f++;
        if (f >= FISH_FRAMES) {
          clearInterval(fishAnim); fishEl.style.opacity = '0'; scheduleFish(); return;
        }
        fishEl.style.backgroundPosition = `${-f * size}px 0px`;
      }, 1000 / FISH_FPS);
    }
    function scheduleFish() {
      clearTimeout(fishTimer);
      fishTimer = setTimeout(playFish, rand(6000, 15000));
    }
    shopGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-buy]'); if (!btn) return;
      const sp = speciesById.get(btn.dataset.buy); if (!sp) return;
      if (countOwned() >= maxAnimals()) return flashHint('Your farm is full!');
      if (st.coins < sp.price) return flashHint('Not enough coins yet.');
      st.coins -= sp.price;
      const a = { uid: uidSeq++, type: sp.id, name: defaultName(sp.id),
                  fullness: 80, water: 85, happy: 85, clean: 80, bornTs: Date.now() };
      st.animals.push(a); makeActor(a, false);
      save(); render(); shopBack.classList.remove('open');
      const act = actors.get(a.uid);
      floatText(act.x, act.y, `+ ${sp.name}!`, '#ff7aa8');
      selectAnimal(a.uid, true);
    });

    // ---------- Movement loop ----------
    let lastFrame = performance.now();
    function frame(now) {
      const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
      for (const [, act] of actors) {
        if (now < act.pauseUntil) {
          act.anim = 'idle';                 // stand + idle-animate while paused
        } else {
          const dx = act.tx - act.x, dy = act.ty - act.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.6) {
            // Arrived: pause a beat, then wander somewhere new.
            pickTarget(act);
            act.pauseUntil = now + rand(500, 2800);
            act.anim = 'idle';
          } else {
            const step = act.speed * dt;
            act.x += (dx / dist) * step;
            act.y += (dy / dist) * step;
            // Direction = dominant axis of travel (y grows downward).
            if (Math.abs(dx) >= Math.abs(dy)) act.dirRow = dx < 0 ? ROWS.left : ROWS.right;
            else                              act.dirRow = dy < 0 ? ROWS.up   : ROWS.down;
            act.anim = 'walk';
            positionActor(act);
          }
        }
        // Step the sprite animation.
        const fps = act.anim === 'walk' ? WALK_FPS : IDLE_FPS;
        act.frameT += dt;
        if (act.frameT >= 1 / fps) {
          act.frameT = 0; act.frame++;
          applySprite(act);
        } else if (act.hasSprite && act.curSheet !== act.anim) {
          applySprite(act);                  // walk<->idle sheet swap, refresh now
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---------- Tick: decay, earnings, wild spawns ----------
    function tick() {
      const now = Date.now();
      const rawDelta = Math.max(0, now - st.lastTs);
      st.lastTs = now;
      advance(rawDelta / HR);
      // New critters only start arriving once a barn is built. Accumulate
      // *active* stream time (ignoring big gaps that mean the tab was
      // hidden/offline); every 6h of active time roll a 50% chance for a
      // critter to appear at the barn.
      if (st.structures.barn) {
        st.spawnAccumMs += Math.min(rawDelta, ACTIVE_STEP_CAP_MS);
        while (st.spawnAccumMs >= SPAWN_INTERVAL_MS) {
          st.spawnAccumMs -= SPAWN_INTERVAL_MS;
          if (Math.random() < SPAWN_CHANCE) triggerBarnSpawn();
        }
      }
      render(); save();
    }

    // ---------- Boot ----------
    (async function boot() {
      await loadSpecies();
      // Offline catch-up earnings (capped) before first render.
      const away = Math.min(OFFLINE_CAP_HR, Math.max(0, (Date.now() - st.lastTs) / HR));
      const earned = advance(away);
      st.lastTs = Date.now();
      save();
      renderDecor();
      renderStructures();
      render();
      scheduleFish();
      if (earned > 0) flashHint(`Welcome back! Your animals earned ${earned} coins while you were away.`);
      setInterval(tick, 4000);
    })();

    // ---------- Resize: keep animals inside the field ----------
    let resizeT = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        const size = animalSizePx();
        for (const [, act] of actors) {
          act.el.style.width = size + 'px'; act.el.style.height = size + 'px';
          act.box = size;
          if (act.hasSprite && act.spr) {
            act.spr.style.width = size + 'px'; act.spr.style.height = size + 'px';
            act.curSheet = '';                 // force background-size refresh
            applySprite(act);
          } else {
            const ph = act.el.querySelector('.ph');
            if (ph) { ph.style.width = size + 'px'; ph.style.height = size + 'px'; ph.style.fontSize = Math.round(size * 0.42) + 'px'; }
          }
          act.x = Math.min(100 - FIELD_MARGIN, Math.max(FIELD_MARGIN, act.x));
          act.y = Math.min(Y_MAX, Math.max(Y_MIN, act.y));
          positionActor(act);
        }
        renderDecor();        // rescale trees/bushes/tufts
        renderStructures();   // rescale barn/troughs to the new field size
      }, 250);
    });

    // ---------- Sakura petals ----------
    (function spawnPetals() {
      const layer = document.getElementById('sakura');
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('span'); p.className = 'f-petal';
        const dur = 7 + Math.random() * 5, size = 9 + Math.random() * 10;
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.width = size + 'px'; p.style.height = size + 'px';
        p.style.setProperty('--drift', (40 + Math.random() * 150) + 'px');
        p.style.setProperty('--petal-opacity', (0.45 + Math.random() * 0.4).toFixed(2));
        p.style.animationDuration = dur.toFixed(2) + 's';
        p.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
        layer.appendChild(p);
      }
    })();
  </script>
</body>
</html>
