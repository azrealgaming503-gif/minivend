<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Pet the Cat · MiniVend</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .p-page    { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .p-header  {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--stroke);
      flex: 0 0 auto;
    }
    .p-stats  { display: flex; gap: 14px; font-size: 16px; flex-wrap: wrap; }
    .p-stats b { color: var(--accent); font-weight: 600; }
    .p-stage  {
      flex: 1 1 auto; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      touch-action: manipulation;
    }
    .cat-wrap {
      width: min(78vmin, 460px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface);
      border: 2px solid var(--stroke);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 60px rgba(255, 122, 58, 0.15);
      transition: transform 0.08s ease, box-shadow 0.18s ease;
      display: flex; align-items: center; justify-content: center;
      font-size: 220px;
    }
    .cat-wrap.poke {
      transform: scale(0.96);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 80px var(--accent);
    }
    .cat-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .float {
      position: absolute;
      font-size: 28px;
      animation: floatUp 900ms ease-out forwards;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    @keyframes floatUp {
      0%   { transform: translate(-50%, 0)        scale(1);   opacity: 1; }
      100% { transform: translate(-50%, -140px)   scale(1.4); opacity: 0; }
    }
    .tip-banner {
      position: absolute; left: 50%; bottom: 24px;
      transform: translateX(-50%);
      padding: 12px 18px; border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm, #ff7a3a));
      color: #000; font-weight: 700; font-size: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      animation: tipPop 2.5s ease-out forwards;
    }
    @keyframes tipPop {
      0%   { transform: translate(-50%, 30px); opacity: 0; }
      10%  { transform: translate(-50%, 0);    opacity: 1; }
      85%  { transform: translate(-50%, 0);    opacity: 1; }
      100% { transform: translate(-50%, -20px);opacity: 0; }
    }
    .unlock-toast {
      position: absolute; left: 50%; top: 16px;
      transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--text); font-size: 14px;
      animation: toast 3s ease-out forwards;
    }
    @keyframes toast {
      0%   { opacity: 0; transform: translate(-50%, -20px); }
      10%  { opacity: 1; transform: translate(-50%, 0); }
      85%  { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
  </style>
</head>
<body>
  <div class="p-page">
    <header class="p-header">
      <a href="/games"><button class="ghost">← Back</button></a>
      <div class="p-stats">
        <span>Pets <b id="pets">0</b></span>
        <span>Streak <b id="streak">0</b></span>
        <span>Unlocked <b id="unlocked">1</b></span>
      </div>
      <button id="reset" class="ghost">Reset</button>
    </header>
    <main class="p-stage" id="stage">
      <div class="cat-wrap" id="cat">🐱</div>
    </main>
  </div>

  <script type="module">
    import { onMessage } from '/js/ws-client.js';
    import '/js/alerts.js';

    const PETS_KEY     = 'minivend.pet.count';
    const UNLOCKED_KEY = 'minivend.pet.unlocked';
    const UNLOCK_EVERY = 100;

    const stage   = document.getElementById('stage');
    const cat     = document.getElementById('cat');
    const petsEl  = document.getElementById('pets');
    const streakEl = document.getElementById('streak');
    const unlockedEl = document.getElementById('unlocked');

    let pets     = parseInt(localStorage.getItem(PETS_KEY) || '0', 10) || 0;
    let unlocked = Math.max(1, parseInt(localStorage.getItem(UNLOCKED_KEY) || '1', 10));
    let streak   = 0;
    let streakTimer = null;
    let frameIndex  = 0;
    let frames      = [];

    petsEl.textContent = pets;
    unlockedEl.textContent = unlocked;

    async function loadFrames() {
      try {
        const r = await fetch('/api/assets/idle/active');
        const j = await r.json();
        if (!j.ok || j.kind !== 'pack' || !j.framesUrl) return;
        const seq = (j.manifest && j.manifest.sequence) || [];
        const seen = new Set();
        for (const step of seq) {
          for (const k of ['loop', 'transition']) {
            const n = step && step[k];
            if (n && !seen.has(n)) { seen.add(n); frames.push(`${j.framesUrl}${n}.jpg`); }
          }
        }
        if (frames.length) showFrame(0);
      } catch (_) { /* fall back to emoji */ }
    }
    function showFrame(i) {
      if (!frames.length) return;
      frameIndex = ((i % frames.length) + frames.length) % frames.length;
      cat.innerHTML = `<img src="${frames[frameIndex]}" alt="cat" />`;
    }
    loadFrames();

    function flyHeart(x, y) {
      const f = document.createElement('div');
      f.className = 'float';
      const emojis = ['❤️', '💖', '✨', '🥰', '😻'];
      f.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const rect = stage.getBoundingClientRect();
      f.style.left = (x - rect.left) + 'px';
      f.style.top  = (y - rect.top)  + 'px';
      stage.appendChild(f);
      setTimeout(() => f.remove(), 1000);
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'unlock-toast';
      t.textContent = msg;
      stage.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function bumpStreak() {
      streak += 1;
      streakEl.textContent = streak;
      clearTimeout(streakTimer);
      streakTimer = setTimeout(() => { streak = 0; streakEl.textContent = 0; }, 1500);
    }

    function addPets(n, x, y) {
      pets += n;
      petsEl.textContent = pets;
      localStorage.setItem(PETS_KEY, String(pets));
      cat.classList.add('poke');
      setTimeout(() => cat.classList.remove('poke'), 90);
      if (x != null) flyHeart(x, y);
      // Unlocks
      const newUnlocked = Math.max(1, Math.floor(pets / UNLOCK_EVERY) + 1);
      if (newUnlocked > unlocked) {
        unlocked = newUnlocked;
        localStorage.setItem(UNLOCKED_KEY, String(unlocked));
        unlockedEl.textContent = unlocked;
        toast(`Pose #${unlocked} unlocked!`);
        if (frames.length) showFrame(unlocked - 1);
      }
    }

    stage.addEventListener('pointerdown', (e) => {
      addPets(1, e.clientX, e.clientY);
      bumpStreak();
    });
    cat.addEventListener('click', (e) => {
      // Cycle through unlocked frames on long-press the cat
      if (frames.length > 1) showFrame(frameIndex + 1);
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (!confirm('Reset all pets and unlocks?')) return;
      pets = 0; unlocked = 1; streak = 0;
      localStorage.removeItem(PETS_KEY);
      localStorage.removeItem(UNLOCKED_KEY);
      petsEl.textContent = 0;
      unlockedEl.textContent = 1;
      streakEl.textContent = 0;
      if (frames.length) showFrame(0);
    });

    // ----- Donation integration -----
    // Every real tip adds bonus pets and shows a banner. Scales with
    // dollar amount: $1 = +20, $5 = +100, $20 = +400 (20× the amount,
    // floored to 1000). The cat also flips to a celebration frame.
    function showTipBanner(name, amount) {
      const b = document.createElement('div');
      b.className = 'tip-banner';
      b.textContent = `Tip from ${name}: +${Math.min(1000, Math.round(amount * 20))} pets!`;
      stage.appendChild(b);
      setTimeout(() => b.remove(), 2500);
    }
    onMessage('donation', (m) => {
      const bonus = Math.min(1000, Math.round((Number(m.amount) || 0) * 20));
      if (bonus <= 0) return;
      addPets(bonus);
      showTipBanner(m.name || 'Anonymous', Number(m.amount) || 0);
      // Cycle frame as a little celebration.
      if (frames.length) showFrame(frameIndex + 1);
    });
  </script>
</body>
</html>
