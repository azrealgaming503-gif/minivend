<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no" />
  <title>Snake · MiniVend</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .snake-page { display: flex; flex-direction: column; height: 100vh; }
    .snake-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--stroke);
    }
    .snake-stats { display: flex; gap: 22px; align-items: baseline; font-size: 20px; }
    .snake-stats b { font-weight: 600; color: var(--accent); }
    .snake-stage { flex: 1; display: flex; align-items: center; justify-content: center; }
    canvas { background: #0a0a0d; border-radius: 14px; border: 1px solid var(--stroke); touch-action: none; }
    .overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
      flex-direction: column; gap: 14px;
    }
    .overlay h2 { font-size: 36px; margin: 0; }
  </style>
</head>
<body>
  <div class="snake-page">
    <header class="snake-header">
      <a href="/games"><button class="ghost">← Back</button></a>
      <div class="snake-stats">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>
      <button id="restart">Restart</button>
    </header>
    <main class="snake-stage" style="position: relative;">
      <canvas id="game" width="960" height="520"></canvas>
      <div id="overlay" class="overlay" hidden>
        <h2 id="overlay-title">Game over</h2>
        <button class="primary" id="overlay-restart">Play again</button>
      </div>
    </main>
  </div>

  <script type="module">
    import '/js/alerts.js';

    const COLS = 24, ROWS = 13, CELL = 40;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl  = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const restartBtn = document.getElementById('restart');
    const overlayRestartBtn = document.getElementById('overlay-restart');

    const BEST_KEY = 'minivend.snake.best';
    let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    bestEl.textContent = best;

    let snake, dir, nextDir, food, score, alive, lastTickMs, tickMs;

    function reset() {
      const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
      snake = [[cx - 2, cy], [cx - 1, cy], [cx, cy]];
      dir = [1, 0];
      nextDir = [1, 0];
      score = 0;
      alive = true;
      lastTickMs = performance.now();
      tickMs = 130;
      spawnFood();
      scoreEl.textContent = score;
      overlay.hidden = true;
    }

    function spawnFood() {
      const occ = new Set(snake.map(([x, y]) => x + ',' + y));
      while (true) {
        const x = (Math.random() * COLS) | 0;
        const y = (Math.random() * ROWS) | 0;
        if (!occ.has(x + ',' + y)) { food = [x, y]; return; }
      }
    }

    function setDir(dx, dy) {
      if (dx === -dir[0] && dy === -dir[1]) return; // no reversing
      nextDir = [dx, dy];
    }

    function tick() {
      if (!alive) return;
      dir = nextDir;
      const head = snake[snake.length - 1];
      const nx = head[0] + dir[0];
      const ny = head[1] + dir[1];
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
      if (snake.some(([x, y]) => x === nx && y === ny)) return die();
      snake.push([nx, ny]);
      if (nx === food[0] && ny === food[1]) {
        score += 1;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem(BEST_KEY, String(best));
        }
        tickMs = Math.max(60, tickMs - 2);
        spawnFood();
      } else {
        snake.shift();
      }
    }

    function die() {
      alive = false;
      overlayTitle.textContent = `Game over — ${score}`;
      overlay.hidden = false;
    }

    function draw() {
      ctx.fillStyle = '#0a0a0d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // grid (very faint)
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, ROWS * CELL);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(COLS * CELL, y * CELL);
        ctx.stroke();
      }
      // food
      ctx.fillStyle = '#d97a7a';
      const [fx, fy] = food;
      const fpad = 6;
      ctx.fillRect(fx * CELL + fpad, fy * CELL + fpad, CELL - fpad * 2, CELL - fpad * 2);
      // snake
      const len = snake.length;
      snake.forEach(([x, y], i) => {
        const t = i / Math.max(1, len - 1);
        ctx.fillStyle = i === len - 1 ? '#62b6cb' : `rgba(98, 182, 203, ${0.45 + 0.45 * t})`;
        const pad = i === len - 1 ? 3 : 4;
        ctx.fillRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      });
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (now - lastTickMs >= tickMs) {
        tick();
        lastTickMs = now;
      }
      draw();
    }

    // ---- Input ----
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
        case ' ': if (!alive) reset(); break;
      }
    });

    // Touch swipes
    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else                              setDir(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    restartBtn.addEventListener('click', reset);
    overlayRestartBtn.addEventListener('click', reset);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
