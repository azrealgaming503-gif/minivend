<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no" />
  <title>Snake · Blu</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .snake-page { display: flex; flex-direction: column; height: 100vh; }
    .snake-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--stroke);
      flex: 0 0 auto;
    }
    .snake-stats { display: flex; gap: 16px; align-items: baseline; font-size: 18px; }
    .snake-stats b { font-weight: 600; color: var(--accent); }
    .snake-stage {
      flex: 1 1 auto;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
      min-height: 0;
    }
    canvas {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 8px 22px rgba(123, 101, 147, 0.10);
    }
    .overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(247, 238, 252, 0.85);
      backdrop-filter: blur(4px);
      flex-direction: column; gap: 14px;
      border-radius: 14px;
    }
    .overlay h2 { font-size: 32px; margin: 0; text-align: center; padding: 0 16px; color: var(--text); }
  </style>
</head>
<body class="theme-pastel">
  <div class="snake-page">
    <header class="snake-header">
      <a href="/games"><button class="ghost">← Back</button></a>
      <div class="snake-stats">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>
      <button id="restart">Restart</button>
    </header>
    <main class="snake-stage" id="stage" style="position: relative;">
      <canvas id="game"></canvas>
      <div id="overlay" class="overlay" hidden>
        <h2 id="overlay-title">Game over</h2>
        <button class="primary" id="overlay-restart">Play again</button>
      </div>
    </main>
  </div>

  <script type="module">
    import '/js/alerts.js';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');

    // Grid + cell sizing is computed from the actual stage area so the
    // board fits any screen ratio (landscape 1024x600, portrait 600x1024,
    // or anything else). Larger cells on bigger screens; we just clamp.
    let COLS = 24, ROWS = 13, CELL = 40;
    function fitBoard() {
      const w = Math.max(stage.clientWidth  - 2, 200);
      const h = Math.max(stage.clientHeight - 2, 200);
      // Aim for a cell big enough to tap, small enough to leave room.
      CELL = Math.max(20, Math.min(44, Math.floor(Math.min(w, h) / 14)));
      COLS = Math.max(8, Math.floor(w / CELL));
      ROWS = Math.max(8, Math.floor(h / CELL));
      canvas.width  = COLS * CELL;
      canvas.height = ROWS * CELL;
    }

    const scoreEl = document.getElementById('score');
    const bestEl  = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const restartBtn = document.getElementById('restart');
    const overlayRestartBtn = document.getElementById('overlay-restart');

    const BEST_KEY = 'minivend.snake.best';
    let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    bestEl.textContent = best;

    let snake, dir, nextDir, food, score, alive, lastTickMs, tickMs;

    function reset() {
      fitBoard();
      const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
      // Three-segment starter snake heading right. Guard against very
      // narrow boards by clamping the tail.
      snake = [
        [Math.max(0, cx - 2), cy],
        [Math.max(1, cx - 1), cy],
        [cx, cy],
      ];
      dir = [1, 0];
      nextDir = [1, 0];
      score = 0;
      alive = true;
      lastTickMs = performance.now();
      tickMs = 130;
      spawnFood();
      scoreEl.textContent = score;
      overlay.hidden = true;
    }

    // Re-fit on orientation change. We only resize cleanly between games
    // to avoid mid-game scaling weirdness — if the kiosk is rotated while
    // playing, the current run continues with the old board and the new
    // dimensions kick in on the next reset().
    window.addEventListener('resize', () => {
      if (!alive) fitBoard();
    });

    function spawnFood() {
      const occ = new Set(snake.map(([x, y]) => x + ',' + y));
      while (true) {
        const x = (Math.random() * COLS) | 0;
        const y = (Math.random() * ROWS) | 0;
        if (!occ.has(x + ',' + y)) { food = [x, y]; return; }
      }
    }

    function setDir(dx, dy) {
      if (dx === -dir[0] && dy === -dir[1]) return; // no reversing
      nextDir = [dx, dy];
    }

    function tick() {
      if (!alive) return;
      dir = nextDir;
      const head = snake[snake.length - 1];
      const nx = head[0] + dir[0];
      const ny = head[1] + dir[1];
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
      if (snake.some(([x, y]) => x === nx && y === ny)) return die();
      snake.push([nx, ny]);
      if (nx === food[0] && ny === food[1]) {
        score += 1;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem(BEST_KEY, String(best));
        }
        tickMs = Math.max(60, tickMs - 2);
        spawnFood();
      } else {
        snake.shift();
      }
    }

    function die() {
      alive = false;
      overlayTitle.textContent = `Game over — ${score}`;
      overlay.hidden = false;
    }

    function draw() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // grid (very faint plum)
      ctx.strokeStyle = 'rgba(123, 101, 147, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, ROWS * CELL);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(COLS * CELL, y * CELL);
        ctx.stroke();
      }
      // food — soft pink
      ctx.fillStyle = '#ffa3d1';
      const [fx, fy] = food;
      const fpad = 6;
      const fcx = fx * CELL + CELL / 2;
      const fcy = fy * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(fcx, fcy, (CELL - fpad * 2) / 2, 0, Math.PI * 2);
      ctx.fill();
      // snake — lavender body, deeper-lavender head
      const len = snake.length;
      snake.forEach(([x, y], i) => {
        const t = i / Math.max(1, len - 1);
        const head = i === len - 1;
        if (head) {
          ctx.fillStyle = '#9669c6';
        } else {
          // gradient from pale pink (tail) → soft lavender (toward head)
          const r = Math.round(255 + (184 - 255) * t);
          const g = Math.round(163 + (134 - 163) * t);
          const b = Math.round(209 + (229 - 209) * t);
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        }
        const pad = head ? 3 : 4;
        const px = x * CELL + pad;
        const py = y * CELL + pad;
        const sz = CELL - pad * 2;
        const r  = Math.min(8, sz / 3);
        ctx.beginPath();
        ctx.moveTo(px + r, py);
        ctx.arcTo(px + sz, py, px + sz, py + sz, r);
        ctx.arcTo(px + sz, py + sz, px, py + sz, r);
        ctx.arcTo(px, py + sz, px, py, r);
        ctx.arcTo(px, py, px + sz, py, r);
        ctx.closePath();
        ctx.fill();
      });
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (now - lastTickMs >= tickMs) {
        tick();
        lastTickMs = now;
      }
      draw();
    }

    // ---- Input ----
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
        case ' ': if (!alive) reset(); break;
      }
    });

    // Touch swipes
    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else                              setDir(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    restartBtn.addEventListener('click', reset);
    overlayRestartBtn.addEventListener('click', reset);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
