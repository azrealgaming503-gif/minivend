<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Whack-a-Cat · MiniVend</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .w-page    { display: flex; flex-direction: column; height: 100vh; }
    .w-header  {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--stroke);
      flex: 0 0 auto;
    }
    .w-stats  { display: flex; gap: 16px; font-size: 18px; }
    .w-stats b { color: var(--accent); font-weight: 600; }
    .w-stage  {
      flex: 1 1 auto; min-height: 0;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 12px; padding: 14px;
    }
    .hole {
      position: relative; overflow: hidden;
      background: radial-gradient(circle at 50% 70%, #1a1d24 0%, #0b0c10 70%);
      border: 1px solid var(--stroke);
      border-radius: 50%;
      box-shadow: inset 0 -8px 22px rgba(0,0,0,0.7);
      touch-action: manipulation;
    }
    .hole.lit { box-shadow: inset 0 -8px 22px rgba(0,0,0,0.7), 0 0 18px var(--accent); }
    .hole img, .hole .placeholder {
      position: absolute; left: 8%; right: 8%; bottom: -120%;
      width: 84%; aspect-ratio: 1 / 1;
      object-fit: cover; border-radius: 50%;
      transition: bottom 220ms cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
      background: var(--surface);
    }
    .hole.up   img, .hole.up   .placeholder { bottom: 8%; }
    .hole.gone img, .hole.gone .placeholder { bottom: -120%; transition-duration: 140ms; }
    .placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 64px;
    }
    .hit-burst {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 36px; color: var(--accent);
      pointer-events: none;
      animation: burst 500ms ease-out forwards;
    }
    @keyframes burst {
      0%   { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(1.6) translateY(-30px); opacity: 0; }
    }
    .overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72);
      flex-direction: column; gap: 14px;
    }
    .overlay h2 { font-size: 30px; margin: 0; text-align: center; }
    .overlay .sub { color: var(--text-2); font-size: 15px; }
  </style>
</head>
<body>
  <div class="w-page">
    <header class="w-header">
      <a href="/games"><button class="ghost">← Back</button></a>
      <div class="w-stats">
        <span>Score <b id="score">0</b></span>
        <span>Time <b id="timer">60</b>s</span>
        <span>Best <b id="best">0</b></span>
      </div>
      <button id="restart">Restart</button>
    </header>
    <main class="w-stage" id="stage"></main>
    <div id="overlay" class="overlay" hidden>
      <h2 id="overlay-title">Time's up!</h2>
      <div class="sub" id="overlay-sub"></div>
      <button class="primary" id="overlay-restart">Play again</button>
    </div>
  </div>

  <script type="module">
    import '/js/alerts.js';

    const NUM_HOLES = 9;
    const ROUND_SECONDS = 60;
    const BEST_KEY = 'minivend.whack.best';

    const stage = document.getElementById('stage');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const bestEl  = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub   = document.getElementById('overlay-sub');

    let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
    bestEl.textContent = best;

    // Pull first-frame URLs from the active idle pack so the cats
    // look like Blu's actual cat. Falls back to 🐱 emoji.
    let catUrls = [];
    async function loadCatFrames() {
      try {
        const r = await fetch('/api/assets/idle/active');
        const j = await r.json();
        if (!j.ok || j.kind !== 'pack' || !j.framesUrl) return;
        const seq = (j.manifest && j.manifest.sequence) || [];
        const seen = new Set();
        for (const step of seq) {
          for (const k of ['loop', 'transition']) {
            const n = step && step[k];
            if (n && !seen.has(n)) { seen.add(n); catUrls.push(`${j.framesUrl}${n}.jpg`); }
          }
        }
      } catch (_) { /* fallback to emoji */ }
    }

    // Build holes
    const holes = [];
    for (let i = 0; i < NUM_HOLES; i++) {
      const h = document.createElement('div');
      h.className = 'hole';
      const cat = document.createElement(catUrls.length ? 'img' : 'div');
      cat.className = catUrls.length ? '' : 'placeholder';
      if (cat.tagName === 'DIV') cat.textContent = '🐱';
      h.appendChild(cat);
      h.addEventListener('pointerdown', () => onHit(i));
      stage.appendChild(h);
      holes.push({ el: h, cat, busy: false, timer: null });
    }
    function refreshCatSprites() {
      if (!catUrls.length) return;
      for (let i = 0; i < holes.length; i++) {
        const h = holes[i];
        if (h.cat.tagName === 'DIV') {
          const img = document.createElement('img');
          h.el.replaceChild(img, h.cat);
          h.cat = img;
        }
        h.cat.src = catUrls[i % catUrls.length];
      }
    }
    loadCatFrames().then(refreshCatSprites);

    let score = 0, timeLeft = ROUND_SECONDS, running = false;
    let popLoopHandle = null, tickHandle = null;

    function popRandom() {
      const free = holes.map((h, i) => h.busy ? -1 : i).filter((i) => i >= 0);
      if (free.length === 0) return;
      const idx = free[Math.floor(Math.random() * free.length)];
      const h   = holes[idx];
      h.busy = true;
      h.el.classList.add('up', 'lit');
      h.el.classList.remove('gone');
      const upMs = 700 + Math.floor(Math.random() * 800);
      h.timer = setTimeout(() => hideHole(idx, false), upMs);
    }

    function hideHole(idx, hit) {
      const h = holes[idx];
      if (h.timer) { clearTimeout(h.timer); h.timer = null; }
      h.el.classList.remove('up', 'lit');
      h.el.classList.add('gone');
      setTimeout(() => { h.busy = false; h.el.classList.remove('gone'); }, 240);
      if (hit) flashBurst(h.el);
    }

    function flashBurst(el) {
      const b = document.createElement('div');
      b.className = 'hit-burst';
      b.textContent = '+1';
      el.appendChild(b);
      setTimeout(() => b.remove(), 500);
    }

    function onHit(idx) {
      if (!running) return;
      const h = holes[idx];
      if (!h.busy || !h.el.classList.contains('up')) return;
      score += 1;
      scoreEl.textContent = score;
      hideHole(idx, true);
    }

    function popLoop() {
      const interval = Math.max(280, 900 - (ROUND_SECONDS - timeLeft) * 10);
      popRandom();
      popLoopHandle = setTimeout(popLoop, interval);
    }

    function startTimer() {
      const started = Date.now();
      tickHandle = setInterval(() => {
        const elapsed = Math.floor((Date.now() - started) / 1000);
        timeLeft = Math.max(0, ROUND_SECONDS - elapsed);
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 250);
    }

    function endGame() {
      running = false;
      if (popLoopHandle) clearTimeout(popLoopHandle);
      if (tickHandle)    clearInterval(tickHandle);
      for (let i = 0; i < holes.length; i++) hideHole(i, false);
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
        bestEl.textContent = best;
      }
      overlayTitle.textContent = 'Time\'s up!';
      overlaySub.textContent   = `You whacked ${score} cat${score === 1 ? '' : 's'}.` +
                                 (score === best && score > 0 ? ' New best!' : '');
      overlay.hidden = false;
    }

    function restart() {
      if (popLoopHandle) clearTimeout(popLoopHandle);
      if (tickHandle)    clearInterval(tickHandle);
      score = 0; timeLeft = ROUND_SECONDS;
      scoreEl.textContent = 0; timerEl.textContent = ROUND_SECONDS;
      for (let i = 0; i < holes.length; i++) hideHole(i, false);
      overlay.hidden = true;
      running = true;
      startTimer();
      popLoop();
    }
    document.getElementById('restart').addEventListener('click', restart);
    document.getElementById('overlay-restart').addEventListener('click', restart);

    restart();
  </script>
</body>
</html>
