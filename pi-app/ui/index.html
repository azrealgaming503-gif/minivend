<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Blukitsune9 · MiniVend</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="idle-body">
  <!-- Boot splash overlay. Painted on the very first frame so it
       visually continues from the plymouth splash and covers the
       gap while the cat video loads / first-frame-paints. Fades
       out the moment the cat is actually playing. -->
  <div id="boot-splash" class="boot-splash">
    <div class="boot-splash-wordmark">
      <span>Blu</span><span class="boot-splash-dot"></span>
    </div>
  </div>

  <!-- Idle screen: only the looping cat animation. Donation alerts still
       overlay on top (alerts.js). Swipe UP anywhere on the screen to open
       the menu page; swipe DOWN from the menu to return. -->
  <div class="kiosk-root" id="root">
    <div class="idle-stage">
      <video id="idle-video-a"  class="idle-media" muted playsinline preload="auto"></video>
      <video id="idle-video-b"  class="idle-media" muted playsinline preload="auto"></video>
      <!-- Cover layer: shows the first frame of the *upcoming* clip
           as a static <img> during the swap. The image matches the
           video element's first decoded frame, so visually the cover
           and the video are indistinguishable — no flash, no jump. -->
      <img   id="idle-cover"    class="idle-cover" alt="" hidden />
      <img   id="idle-image"    class="idle-image" alt="" hidden />
    </div>

    <div id="idle-empty" class="idle-empty" hidden>
      <div>
        <p>Hello! No idle animation set yet.</p>
        <a class="pill" href="/settings">Open settings</a>
      </div>
    </div>

    <!-- Swipe hint that auto-fades after a few seconds, so the screen
         is just the cat in steady state. -->
    <div class="swipe-hint" id="swipe-hint">
      <div class="swipe-hint-arrow"></div>
      <div class="swipe-hint-label">swipe up for menu</div>
    </div>
  </div>

  <script type="module">
    import { onMessage } from '/js/ws-client.js';
    import '/js/alerts.js';

    const root      = document.getElementById('root');
    const videoA    = document.getElementById('idle-video-a');
    const videoB    = document.getElementById('idle-video-b');
    const image     = document.getElementById('idle-image');
    const cover     = document.getElementById('idle-cover');
    const empty     = document.getElementById('idle-empty');
    const swipeHint = document.getElementById('swipe-hint');
    const bootSplash = document.getElementById('boot-splash');

    // ===== Boot-splash handoff =====
    // The plymouth splash stays on-screen for the whole boot, then
    // we ask the server to tear it down via /api/kiosk-ready. To
    // avoid even a single-frame gap, we keep a matching in-page
    // splash visible until the cat video has actually painted its
    // first frame, then fade both at once.
    let kioskReadyFired = false;
    function dismissBootSplash() {
      if (kioskReadyFired) return;
      kioskReadyFired = true;
      // Two rAFs: lets the new frame be presented BEFORE we tell
      // plymouth to quit, so the chromium framebuffer is guaranteed
      // to have content the moment plymouth releases.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        bootSplash.classList.add('hidden');
        fetch('/api/kiosk-ready', { method: 'POST' }).catch(() => {});
        // Remove from the DOM after the fade so it can't intercept
        // touches (z-index: 50; pointer-events: none would also work).
        setTimeout(() => bootSplash.remove(), 900);
      }));
    }
    // Hard backstop: if no idle clip ever paints (no animations
    // installed, server unreachable, etc.) we still drop the splash
    // after 12s so the user can see the empty-state UI / menu swipe.
    setTimeout(dismissBootSplash, 12000);

    // ===== Cover layer =====
    // Cover is an <img> that shows the FIRST FRAME of the upcoming clip
    // (extracted server-side via ffmpeg). During the swap window we
    // display this static image on top of the videos; the underlying
    // video element warms up, swaps z-index, and starts playing from
    // exactly that frame — so the transition from "static cover image"
    // to "playing video" is visually invisible.
    cover.addEventListener('error', () => {
      console.warn('[idle] cover image failed to load:', cover.src);
    });
    cover.addEventListener('load', () => {
      console.log('[idle] cover loaded:', cover.currentSrc);
    });
    function showCoverWithUrl(url) {
      if (!url) return false;
      // Clear src first so the browser doesn't keep a previously-broken
      // image state when we reassign the same URL later.
      cover.removeAttribute('src');
      cover.src = url;
      cover.hidden = false;
      return true;
    }
    function hideCover() { cover.hidden = true; }
    // Pre-load a cover image into the browser's HTTP cache so showing
    // it later is instant (no network round-trip during the swap).
    function preloadCover(url) {
      if (!url) return;
      const img = new Image();
      img.onerror = () => console.warn('[idle] preload cover failed:', url);
      img.src = url;
    }

    // ===== Swipe-up to /menu, swipe-down to no-op (we're already on idle) =====
    // Captures touch *and* mouse drag (helps when developing on a non-touch
    // monitor). A vertical drag of > 80 px in the right direction triggers
    // the navigation. Horizontal drag is ignored.
    (function installSwipe() {
      let startY = null, startX = null, startT = 0;
      const THRESHOLD = 80;       // px
      const MAX_TIME  = 800;      // ms
      const MAX_DRIFT = 60;       // px sideways

      function onStart(e) {
        const p = e.touches ? e.touches[0] : e;
        startY = p.clientY; startX = p.clientX; startT = Date.now();
      }
      function onEnd(e) {
        if (startY === null) return;
        const p = e.changedTouches ? e.changedTouches[0] : e;
        const dy = p.clientY - startY;
        const dx = p.clientX - startX;
        const dt = Date.now() - startT;
        startY = startX = null;
        if (dt > MAX_TIME) return;
        if (Math.abs(dx) > MAX_DRIFT) return;
        if (-dy > THRESHOLD) {
          // Swipe up
          location.href = '/menu';
        }
      }
      window.addEventListener('touchstart',  onStart, { passive: true });
      window.addEventListener('touchend',    onEnd,   { passive: true });
      window.addEventListener('mousedown',   onStart);
      window.addEventListener('mouseup',     onEnd);
    })();

    // Hide the swipe hint after first interaction OR 6 seconds, whichever
    // comes first. Re-show it briefly any time the user taps without swiping.
    let hintHideTimer = null;
    function hideHint(delay = 0) {
      clearTimeout(hintHideTimer);
      hintHideTimer = setTimeout(() => swipeHint.classList.add('hidden'), delay);
    }
    function flashHint() {
      swipeHint.classList.remove('hidden');
      hideHint(2500);
    }
    hideHint(6000);
    window.addEventListener('touchstart', flashHint, { passive: true });

    // ===== Idle player =====
    // Two-element ping-pong: activeEl is what the user sees, bufferEl is
    // preloading the *next* clip. We swap pointers when we transition, so
    // the active element's src is never reassigned mid-playback (which
    // would otherwise blank the frame and cause the flash you noticed).
    let activeEl = videoA;
    let bufferEl = videoB;
    let currentPlayer = null;

    function showVideoElements() {
      empty.hidden = true;
      image.hidden = true;
    }
    function showImageMode() {
      empty.hidden = true;
      videoA.classList.remove('active'); videoA.hidden = true;
      videoB.classList.remove('active'); videoB.hidden = true;
      image.hidden = false;
      // Static image idle = no first-frame event; dismiss splash on load.
      image.onload = dismissBootSplash;
    }
    function showEmpty() {
      videoA.classList.remove('active');
      videoB.classList.remove('active');
      image.hidden = true;
      empty.hidden = false;
      dismissBootSplash();
    }

    function setActiveVideo(el) {
      activeEl = el;
      bufferEl = (el === videoA) ? videoB : videoA;
      videoA.classList.toggle('active', el === videoA);
      videoB.classList.toggle('active', el === videoB);
      videoA.hidden = false;
      videoB.hidden = false;
    }

    function safePlay(el) {
      const p = el.play();
      if (p && typeof p.catch === 'function') {
        p.catch((err) => console.warn('[idle] play() rejected:', err && err.message));
      }
    }

    // Load a clip into an element and wait for it to be playable. Resolves
    // when the browser says it has enough buffered to play through. Times
    // out after `timeoutMs` so we don't hang forever on a missing/bad file.
    function preloadInto(el, url, timeoutMs = 6000) {
      return new Promise((resolve) => {
        let done = false;
        const finish = () => { if (done) return; done = true; cleanup(); resolve(); };
        const onCanPlay = () => finish();
        const onError   = () => finish();
        function cleanup() {
          el.removeEventListener('canplaythrough', onCanPlay);
          el.removeEventListener('loadeddata',     onCanPlay);
          el.removeEventListener('error',          onError);
          clearTimeout(timer);
        }
        el.addEventListener('canplaythrough', onCanPlay, { once: true });
        el.addEventListener('loadeddata',     onCanPlay, { once: true });
        el.addEventListener('error',          onError,   { once: true });
        const timer = setTimeout(finish, timeoutMs);
        el.src = url;
        try { el.load(); } catch (_) { /* ignore */ }
      });
    }

    function teardownPlayer() {
      if (currentPlayer) { currentPlayer.stop(); currentPlayer = null; }
      [videoA, videoB].forEach((v) => {
        v.onended = null;
        v.onerror = null;
        v.pause();
        v.removeAttribute('src');
        v.load();
      });
    }

    // ---- Simple single-file player ----
    class FilePlayer {
      constructor(url, ext) { this.url = url; this.ext = ext; }
      async start() {
        const isVideo = ['mp4', 'webm', 'mov', 'm4v'].includes(this.ext);
        if (isVideo) {
          showVideoElements();
          setActiveVideo(videoA);
          activeEl.loop = true;
          await preloadInto(activeEl, this.url);
          safePlay(activeEl);
          if (typeof activeEl.requestVideoFrameCallback === 'function') {
            activeEl.requestVideoFrameCallback(dismissBootSplash);
          } else {
            activeEl.addEventListener('playing', dismissBootSplash, { once: true });
          }
        } else {
          showImageMode();
          image.src = this.url;
        }
      }
      stop() { /* nothing */ }
    }

    // ---- Cat-cycle state machine player ----
    //
    // Sequence runs forever as nap_1 → trans_1 → nap_2 → trans_2 → nap_3 →
    // trans_3 → nap_1 → … . Each nap loops for a random duration between
    // manifest.loop_min_seconds and loop_max_seconds. Transitions play once.
    // We always have the *next* clip loaded into bufferEl, so swaps are
    // frame-perfect: no `src` reassignment mid-playback.
    class CatCyclePlayer {
      constructor(baseUrl, framesUrl, manifest) {
        this.baseUrl   = baseUrl;
        this.framesUrl = framesUrl || (baseUrl + '_frames/');
        this.manifest  = manifest;
        this.index = 0;
        this.loopTimer = null;
        this.stopped = false;
      }

      _absUrl(rel)      { return this.baseUrl   + encodeURIComponent(rel); }
      _frameUrl(rel)    { return this.framesUrl + encodeURIComponent(rel) + '.jpg'; }
      _step()           { return this.manifest.sequence[this.index]; }

      async start() {
        showVideoElements();
        this.stopped = false;
        // Preload the first nap clip into A, then start playing it.
        setActiveVideo(videoA);
        const step = this._step();
        activeEl.loop = true;
        activeEl.onended = null;
        activeEl.onerror = (e) => { console.warn('[idle] first clip error', e); this._advance(); };
        await preloadInto(activeEl, this._absUrl(step.loop));
        if (this.stopped) return;
        safePlay(activeEl);
        // First cat frame painted = boot splash can go.
        if (typeof activeEl.requestVideoFrameCallback === 'function') {
          activeEl.requestVideoFrameCallback(dismissBootSplash);
        } else {
          activeEl.addEventListener('playing', dismissBootSplash, { once: true });
        }
        this._scheduleTransition();
        // Preload the upcoming transition video AND its cover image.
        if (step.transition) {
          preloadInto(bufferEl, this._absUrl(step.transition));
          preloadCover(this._frameUrl(step.transition));
        }
      }

      stop() {
        this.stopped = true;
        clearTimeout(this.loopTimer);
        this.loopTimer = null;
      }

      _scheduleTransition() {
        clearTimeout(this.loopTimer);
        const min = Number(this.manifest.loop_min_seconds) || 600;
        const max = Number(this.manifest.loop_max_seconds) || Math.max(min, 900);
        const lo = Math.min(min, max);
        const hi = Math.max(min, max);
        const dur = (lo + Math.random() * (hi - lo)) * 1000;
        const step = this._step();
        console.log(`[idle] loop "${step.loop}" for ${Math.round(dur / 1000)}s`);
        this.loopTimer = setTimeout(() => this._playTransition(), dur);
      }

      // Start playing a video element while it's still hidden behind the
      // active one, then resolve once the browser has actually painted its
      // first frame. This warms up the Pi 5's vc4 hardware video decoder
      // BEFORE we bring the element to the front, eliminating the ~50-100ms
      // decoder-init flash that the user would otherwise see during the
      // first frames of a freshly-played clip.
      async _startInBackground(el, { loop }) {
        el.loop = loop;
        el.muted = true;
        try { el.currentTime = 0; } catch (_) { /* ignore */ }
        const playPromise = el.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => { /* may be rejected on autoplay-policy; ignore */ });
        }
        await new Promise((resolve) => {
          let done = false;
          const finish = () => { if (done) return; done = true; resolve(); };
          if (typeof el.requestVideoFrameCallback === 'function') {
            // Fires once a new frame has been composited and is visible.
            el.requestVideoFrameCallback(() => finish());
          } else {
            el.addEventListener('playing', finish, { once: true });
          }
          // Belt-and-suspenders timeout. We'd rather show a tiny gap than
          // hang forever if the decoder is unresponsive.
          setTimeout(finish, 600);
        });
      }

      // Perform the swap behind a cover image showing the first frame of
      // the *upcoming* clip. Because the cover frame == the new video's
      // first frame, the transition from "cover img" to "playing video"
      // is visually seamless even if the underlying decoder/compositor
      // takes a moment to swap.
      async _swapWithCover(coverClipName, loop) {
        showCoverWithUrl(this._frameUrl(coverClipName));
        // Wait two rAFs so the cover image is actually presented to the
        // display before we mess with the video layers underneath.
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        // Behind the (now-visible) cover, warm up the buffer element.
        await this._startInBackground(bufferEl, { loop });
        if (this.stopped) { hideCover(); return; }
        // Flip z-index so bufferEl is on top.
        setActiveVideo(bufferEl);
        // Hold the cover one more frame so the underlying z-index swap
        // is definitely committed before we drop the cover.
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        hideCover();
      }

      async _playTransition() {
        if (this.stopped) return;
        const step = this._step();
        if (!step.transition) { this._advance(); return; }
        // BufferEl already has the transition preloaded.
        bufferEl.onended = null;
        bufferEl.onerror = (e) => { console.warn('[idle] transition error', e); this._advance(); };
        await this._swapWithCover(step.transition, false);
        if (this.stopped) return;
        activeEl.onended = () => this._advance();
        // Recycle the (now-hidden) buffer for the next nap clip a beat
        // later, and preload its cover image too.
        const nextStep = this.manifest.sequence[(this.index + 1) % this.manifest.sequence.length];
        if (nextStep && nextStep.loop) {
          preloadCover(this._frameUrl(nextStep.loop));
          setTimeout(() => {
            if (this.stopped) return;
            bufferEl.loop = true;
            preloadInto(bufferEl, this._absUrl(nextStep.loop));
          }, 200);
        }
      }

      async _advance() {
        if (this.stopped) return;
        this.index = (this.index + 1) % this.manifest.sequence.length;
        const step = this._step();
        bufferEl.onended = null;
        bufferEl.onerror = (e) => { console.warn('[idle] loop error', e); this._advance(); };
        // Defensive: if the preload didn't happen (eg. last transition was
        // too short for the loop to buffer in time), set src now and accept
        // a small delay over a crash.
        if (!bufferEl.src) {
          bufferEl.src = this._absUrl(step.loop);
          try { bufferEl.load(); } catch (_) { /* ignore */ }
        }
        await this._swapWithCover(step.loop, true);
        if (this.stopped) return;
        this._scheduleTransition();
        // Recycle the (now-hidden) buffer for the upcoming transition,
        // and preload its cover image.
        if (step.transition) {
          preloadCover(this._frameUrl(step.transition));
          setTimeout(() => {
            if (this.stopped) return;
            bufferEl.loop = false;
            preloadInto(bufferEl, this._absUrl(step.transition));
          }, 200);
        }
      }
    }

    async function loadActiveIdle() {
      teardownPlayer();
      let r;
      try { r = await fetch('/api/assets/idle/active'); }
      catch (e) { console.warn('[idle] fetch failed', e); showEmpty(); return; }
      if (r.status === 404) { showEmpty(); return; }
      if (!r.ok)            { showEmpty(); return; }
      const j = await r.json();
      if (j.kind === 'file') {
        const ext = (j.name.split('.').pop() || '').toLowerCase();
        currentPlayer = new FilePlayer(`${j.url}?v=${Date.now()}`, ext);
        currentPlayer.start();
      } else if (j.kind === 'pack' && j.manifest && Array.isArray(j.manifest.sequence)) {
        currentPlayer = new CatCyclePlayer(j.baseUrl, j.framesUrl, j.manifest);
        currentPlayer.start();
      } else {
        console.warn('[idle] unknown asset kind', j);
        showEmpty();
      }
    }

    // ===== Live updates =====
    onMessage('idle_changed', () => loadActiveIdle());

    // ===== Pause the cat while a donation overlay is active =====
    // alerts.js toggles document.body.classList "alert-active". When it's
    // on, pause both video elements (we don't know which is active right
    // now) — pause is a no-op on a paused video. When it goes off, resume
    // the one with the highest z-index (the "active" one).
    const bodyObserver = new MutationObserver(() => {
      const alerting = document.body.classList.contains('alert-active');
      if (alerting) {
        try { videoA.pause(); videoB.pause(); } catch (_) {}
      } else {
        // Active is whichever has the "active" class (z-index 2).
        const top = videoA.classList.contains('active') ? videoA :
                    videoB.classList.contains('active') ? videoB : null;
        if (top) safePlay(top);
      }
    });
    bodyObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    loadActiveIdle();
  </script>
</body>
</html>
